<head>

  <style>
    :root {
      --dark: #0f172a;
      --dark-light: #1e293b;
      --orange: #f97316;
      --orange-dark: #ea580c;
      --background: #f8fafc;
      --white: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      background: var(--dark);
      color: white;
    }

    .navbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: var(--orange);
      font-size: 1.4rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      align-items: center;
      font-size: .95rem;
    }

    .nav-links a:hover {
      color: #fdba74;
    }

    .hero {
      padding: 82px 20px;
      text-align: center;
      background:
        linear-gradient(135deg, rgba(15, 23, 42, .98), rgba(76, 29, 149, .95));
    }

    .hero-content {
      width: min(780px, 100%);
      margin: 0 auto;
    }

    .hero h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 5vw, 3.8rem);
      line-height: 1.08;
    }

    .hero p {
      margin: 0 auto 30px;
      color: #e2e8f0;
      font-size: 1.1rem;
    }

    .button {
      display: inline-block;
      padding: 13px 23px;
      border-radius: 999px;
      background: var(--orange);
      color: white;
      font-weight: bold;
      transition: .2s ease;
    }

    .button:hover,
    .product-button:hover {
      background: var(--orange-dark);
      transform: translateY(-1px);
    }

    .ad-box {
      min-height: 100px;
      margin: 28px auto;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #94a3b8;
      border-radius: 12px;
      background: #e2e8f0;
      color: var(--muted);
      font-size: .85rem;
      text-align: center;
    }

    .section {
      padding: 48px 0;
    }

    .section h2 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
    }

    .section-intro {
      margin: 0 0 30px;
      color: var(--muted);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .07);
      transition: .2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(15, 23, 42, .13);
    }

    .product-icon {
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff7ed, #f1f5f9);
      font-size: 4rem;
    }

    .product-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 20px;
    }

    .category {
      margin-bottom: 8px;
      color: var(--orange-dark);
      font-size: .75rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .product-title {
      min-height: 70px;
      margin: 0 0 12px;
      font-size: 1rem;
      line-height: 1.35;
    }

    .product-description {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: .9rem;
    }

    .product-button {
      display: block;
      width: 100%;
      margin-top: auto;
      padding: 12px;
      border-radius: 9px;
      background: var(--orange);
      color: white;
      text-align: center;
      font-weight: bold;
      transition: .2s ease;
    }

    .affiliate-notice {
      margin: 30px 0 0;
      padding: 18px;
      border-left: 4px solid var(--orange);
      border-radius: 8px;
      background: #fff7ed;
      color: #7c2d12;
      font-size: .92rem;
    }

    .legal-section {
      padding: 55px 0;
      background: white;
      border-top: 1px solid var(--border);
    }

    .legal-section h2 {
      margin-top: 0;
    }

    .legal-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .legal-card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }``html
