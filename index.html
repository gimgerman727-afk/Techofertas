<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TechOfertas Brasil | Ofertas de Tecnologia</title>
  <meta name="description" content="Seleção de produtos de tecnologia, áudio e acessórios encontrados na Amazon Brasil.">
  <meta name="theme-color" content="#0f172a">

  <style>
    :root {
      --dark: #0f172a;
      --dark-2: #1e293b;
      --orange: #f97316;
      --orange-dark: #ea580c;
      --light: #f8fafc;
      --white: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--light);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    .container {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--dark);
      color: var(--white);
      box-shadow: 0 2px 12px rgba(0, 0, 0, .18);
    }

    .nav {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: var(--orange);
      font-size: 1.35rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: .95rem;
    }

    .nav-links a:hover {
      color: #fdba74;
    }

    .menu-button {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 1.6rem;
      cursor: pointer;
    }

    .hero {
      padding: 82px 0;
      color: white;
      text-align: center;
      background:
        linear-gradient(135deg, rgba(15, 23, 42, .98), rgba(76, 29, 149, .94)),
        radial-gradient(circle at top right, #f97316, transparent 40%);
    }

    .hero-content {
      width: min(780px, 100%);
      margin: 0 auto;
    }

    .hero h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 5vw, 3.8rem);
      line-height: 1.08;
    }

    .hero p {
      margin: 0 auto 30px;
      color: #e2e8f0;
      font-size: 1.1rem;
    }

    .button {
      display: inline-block;
      border: 0;
      border-radius: 999px;
      padding: 13px 22px;
      background: var(--orange);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .button:hover {
      background: var(--orange-dark);
      transform: translateY(-1px);
    }

    .ad-box {
      min-height: 100px;
      margin: 28px auto;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #94a3b8;
      border-radius: 12px;
      background: #e2e8f0;
      color: #64748b;
      text-align: center;
      font-size: .85rem;
    }

    .section {
      padding: 48px 0;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
    }

    .section-subtitle {
      margin: 0 0 28px;
      color: var(--muted);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .06);
      transition: .2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(15, 23, 42, .12);
    }

    .product-visual {
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: linear-gradient(135deg, #fff7ed, #f1f5f9);
      font-size: 3.8rem;
    }

    .product-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 17px;
    }

    .product-category {
      margin-bottom: 8px;
      color: var(--orange-dark);
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .product-title {
      min-height: 72px;
      margin: 0 0 12px;
      font-size: 1rem;
      line-height: 1.35;
    }

    .product-description {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: .88rem;
    }

    .product-button {
      width: 100%;
      margin-top: auto;
      padding: 11px 14px;
      border-radius: 9px;
      background: var(--orange);
      color: white;
      text-align: center;
      font-weight: 700;
      transition: .2s ease;
    }

    .product-button:hover {
      background: var(--orange-dark);
    }

    .notice {
      margin: 28px 0;
      padding: 18px;
      border-left: 4px solid var(--orange);
      border-radius: 8px;
      background: #fff7ed;
      color: #7c2d12;
      font-size: .92rem;
    }

    .legal-section {
      padding: 56px 0;
      background: white;
      border-top: 1px solid var(--border);
    }

    .legal-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
    }

    .legal-card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }

    .legal-card h3 {
      margin-top: 0;
      color: var(--dark);
    }

    .legal-card p,
    .legal-card li {
      color: var(--muted);
      font-size: .92rem;
    }

    .legal-card ul {
      padding-left: 20px;
    }

    footer {
      padding: 42px 0 22px;
      background: var(--dark);
      color: #cbd5e1;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 32px;
    }

    footer h3,
    footer h4 {
      margin-top: 0;
      color: white;
    }

    footer p {
      color: #94a3b8;
      font-size: .9rem;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 9px;
      font-size: .9rem;
    }

    .footer-links a:hover {
      color: #fdba74;
    }

    .copyright {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #334155;
      color: #64748b;
      font-size: .8rem;
      text-align: center;
    }

    .cookie-notice {

      right: 18px;
      bottom: 18px;
      z-index: 200;
      width: min(390px, calc(100% - 36px));
      padding: 18px;

      background: var(--dark);
